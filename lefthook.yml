# https://lefthook.dev/configuration/

output:
  - failure
  - execution_out

pre-commit:
  parallel: true
  jobs:
    # Full gate runs here (not pre-push) so every commit lands green — no fix-up
    # commits. lint/typecheck can't be staged-scoped (typecheck is whole-program),
    # so they check the working tree; Turbo caches unchanged packages. ADR-007.
    - name: lint
      run: pnpm lint

    - name: typecheck
      run: pnpm exec turbo run typecheck

    # Sequential (piped) to avoid racing .md writes; oxfmt last so output matches CI's oxfmt --check.
    - name: format
      group:
        piped: true
        jobs:
          - name: markdownlint
            glob: '*.md'
            run: pnpm exec markdownlint-cli2 --fix {staged_files}
            stage_fixed: true

          - name: oxfmt
            glob: '*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css,html,md}'
            run: pnpm exec oxfmt {staged_files}
            stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    # bd issue-graph sync over the git remote (refs/dolt/data).
    # Inert until a remote exists.
    - name: bd-sync
      use_stdin: true
      run: bd hooks run pre-push

post-merge:
  jobs:
    - name: bd-sync
      run: bd hooks run post-merge

post-checkout:
  jobs:
    - name: bd-sync
      run: bd hooks run post-checkout

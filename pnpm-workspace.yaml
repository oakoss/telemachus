packages:
  - apps/*
  - packages/*

# Shared dep versions — reference as "catalog:" in any package; bump once here. See docs/specs/scaffold.md.
catalog:
  '@t3-oss/env-core': ^0.13.11
  '@types/node': ^25.9.2
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  react: ^19.2.7
  react-dom: ^19.2.7
  typescript: ^6.0.3
  vite: ^8.0.16
  eslint: ^10.4.1
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.60.1
  eslint-plugin-oxlint: ^1.68.0
  '@vitest/eslint-plugin': ^1.6.19
  globals: ^17.6.0
  '@eslint-react/eslint-plugin': ^5.8.16
  '@tanstack/eslint-plugin-router': ^1.162.0
  eslint-plugin-better-tailwindcss: ^4.5.0
  eslint-plugin-perfectionist: ^5.9.0
  uuid: ^14.0.0
  vitest: ^4.1.8
  zod: ^4.4.3
  '@tanstack/db': ^0.6.8
  '@tanstack/browser-db-sqlite-persistence': ^0.2.0
  '@tanstack/react-db': ^0.1.86
  '@tanstack/electric-db-collection': ^0.3.6
  '@electric-sql/client': ^1.5.20
  postgres: ^3.4.9
  testcontainers: ^12.0.1
  '@testcontainers/postgresql': ^12.0.1
  jiti: ^2.7.0

allowBuilds:
  # Denied: its postinstall downloads the PowerSync dynamic core over the
  # network. We use plain wa-sqlite/OPFS (the prebuilt dist/*.wasm already
  # ship); the PowerSync core isn't used. Revisit only if OPFS fails at runtime.
  '@journeyapps/wa-sqlite': false
  # Testcontainers' ssh2 transport (and its cpu-features optional dep) only
  # build native crypto for remote-Docker-over-SSH; local Docker uses the pure-JS
  # fallback. protobufjs ships prebuilt — its postinstall isn't needed.
  cpu-features: false
  esbuild: true
  lefthook: true
  lightningcss: true
  protobufjs: false
  ssh2: false

# Pin pnpm's default explicitly (minutes; 1440 = 1 day).
minimumReleaseAge: 1440
# nitro-nightly is required by TanStack Start's Vite plugin; exempt it from the
# 1-day cooldown (it is a nightly). Drop when Start ships a stable nitro.
minimumReleaseAgeExclude:
  - nitro-nightly@3.0.1-20260605-145636-4ab22a9d

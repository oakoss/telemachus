packages:
  - apps/*
  - packages/*

# Shared dep versions — reference as "catalog:" in any package; bump once here. See docs/specs/scaffold.md.
catalog:
  '@t3-oss/env-core': ^0.13.11
  '@types/node': ^25.9.2
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  react: ^19.2.7
  react-dom: ^19.2.7
  typescript: ^6.0.3
  vite: ^8.0.16
  eslint: ^10.4.1
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.60.1
  eslint-plugin-oxlint: ^1.68.0
  '@vitest/eslint-plugin': ^1.6.19
  globals: ^17.6.0
  '@eslint-react/eslint-plugin': ^5.8.13
  '@tanstack/eslint-plugin-router': ^1.162.0
  eslint-plugin-better-tailwindcss: ^4.5.0
  eslint-plugin-perfectionist: ^5.9.0
  uuid: ^14.0.0
  vitest: ^4.1.8
  zod: ^4.4.3

allowBuilds:
  esbuild: true
  lefthook: true
  lightningcss: true

# Pin pnpm's default explicitly (minutes; 1440 = 1 day).
minimumReleaseAge: 1440
# nitro-nightly is required by TanStack Start's Vite plugin; exempt it from the
# 1-day cooldown (it is a nightly). Drop when Start ships a stable nitro.
minimumReleaseAgeExclude:
  - nitro-nightly@3.0.1-20260604-184855-0a07991c

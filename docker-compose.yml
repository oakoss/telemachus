# Dev backing services. The app itself runs on the host (`pnpm dev`) — Docker
# is only for backing services here, the deploy image (8zj.6.2), and test
# databases (Testcontainers). Scope: Postgres for server Drizzle + Better Auth,
# and Electric behind the `electric` profile (the 8zj.8 sync spike):
# `docker compose --profile electric up -d`. MinIO arrives at a later rung.
name: telemachus

services:
  postgres:
    # Pinned to 17 (current stable) rather than 18 because the Electric spike
    # this unblocks (8zj.8) needs a major Electric is known to support; revisit
    # the bump once that spike confirms compatibility. pgvector (server semantic
    # recall, a later rung) swaps to the pgvector/pgvector image when needed.
    image: postgres:17
    restart: unless-stopped
    # Electric consumes the WAL via logical replication; harmless without it.
    command: ['postgres', '-c', 'wal_level=logical']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telemachus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemachus}
      POSTGRES_DB: ${POSTGRES_DB:-telemachus}
    ports:
      # Loopback-only: host-run app/tools (`pnpm dev`, drizzle-kit) reach it, but
      # the dev DB (default creds) is never exposed to the LAN.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-telemachus} -d ${POSTGRES_DB:-telemachus}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  electric:
    # 1.6.10 released inside the 1-day cooldown window (same posture as npm
    # deps); bump on the next touch.
    image: electricsql/electric:1.6.9
    restart: unless-stopped
    profiles: [electric]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-telemachus}:${POSTGRES_PASSWORD:-telemachus}@postgres:5432/${POSTGRES_DB:-telemachus}?sslmode=disable
      # Dev-only: no API auth inside the loopback-bound container. The app's
      # shape proxy is the only intended consumer.
      ELECTRIC_INSECURE: 'true'
    ports:
      # Loopback-only, same reasoning as Postgres above. Host port 3010 — the
      # app dev server owns 3000 and the e2e build 3100.
      - '127.0.0.1:${ELECTRIC_PORT:-3010}:3000'

volumes:
  pgdata:
